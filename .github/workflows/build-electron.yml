# Builds QuetzaLib-APP's Flutter web output, drops it into electron/web/,
# and packages the Windows app. Pushing an exe-v* tag also publishes it.
name: build-electron

on:
  push:
    branches: [main]
    tags: ['exe-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      app_ref:
        description: QuetzaLib-APP ref to package
        default: main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: electron } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ZYDRAXYL/QuetzaLib-APP
          ref: ${{ inputs.app_ref || 'main' }}
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      - run: dart run sqflite_common_ffi_web:setup
      # bundle CanvasKit instead of loading it from gstatic — the desktop app must work offline
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with: { name: quetzalib-web, path: build/web }

  windows:
    needs: [test, web]
    runs-on: windows-latest
    defaults: { run: { working-directory: electron } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: quetzalib-web, path: electron/web }
      - run: npm ci || npm install
      - run: npm run build:installer
      - run: npm run build:exe
      - uses: actions/upload-artifact@v4
        with:
          name: quetzalib-windows
          path: |
            electron/dist/*.exe
      - if: startsWith(github.ref, 'refs/tags/exe-v')
        uses: softprops/action-gh-release@v2
        with:
          files: electron/dist/*.exe
